spring:
  application:
    name: yesgrad-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/yesGradLocal
    username: postgres
    password: admin
    pool:
      enabled: true
      initial-size: 1
      max-size: 10
  datasource:
    url: jdbc:postgresql://localhost:5432/yesGradLocal
    username: postgres
    password: admin
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  security:
    jwt:
      secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
      expiration: 86400000 # 24 hours
      refresh-expiration: 604800000 # 7 days
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

file:
  upload:
    dir: ${user.dir}/uploads/profiles

yesgrad:
  company-name: ${COMPANY_NAME:YesGrad LLC}
  phone-number: ${PHONE_NUMBER:(800) 913-1372}

app:
  yesgrad:
    company-name: ${COMPANY_NAME:YesGrad LLC}
    phone-number: ${PHONE_NUMBER:(800) 913-1372}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  security:
    password-history-limit: 5
    reset-rate-limit: 3
    reset-rate-window-hours: 1
  brevo:
    api-key: ${BREVO_API_KEY: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}
    sender:
      email: ${BREVO_SENDER_EMAIL:lovens@lovenstate.com}
      name: ${BREVO_SENDER_NAME:YesGrad}

logging:
  level:
    com.yesgrad: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot: INFO
    io.netty: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
