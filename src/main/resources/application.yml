server:
  port: ${PORT:8080}

spring:
  application:
    name: yesgrad-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  r2dbc:
    url: ${R2DBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 1
      max-size: 10
  datasource:
    url: ${JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    ignore-missing-migrations: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 86400000
      refresh-expiration: 604800000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:/tmp/uploads/profiles}

yesgrad:
  company-name: ${COMPANY_NAME:YesGrad LLC}
  phone-number: ${PHONE_NUMBER:(800) 913-1372}

app:
  yesgrad:
    company-name: ${COMPANY_NAME:YesGrad LLC}
    phone-number: ${PHONE_NUMBER:(800) 913-1372}
  frontend:
    url: ${FRONTEND_URL}
  security:
    password-history-limit: 5
    reset-rate-limit: 3
    reset-rate-window-hours: 1
  brevo:
    api-key: ${BREVO_API_KEY}
    sender:
      email: ${BREVO_SENDER_EMAIL}
      name: ${BREVO_SENDER_NAME:YesGrad}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics